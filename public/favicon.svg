<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Deep Abyss Background -->
  <rect width="32" height="32" rx="4" fill="#0B0D14" />
  <!-- Rift Glow Rim -->
  <rect x="3" y="3" width="26" height="26" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.45" />
  <!-- Helmet Outer Shell -->
  <rect x="8" y="5" width="16" height="4" fill="#2B2F3A" />
  <rect x="6" y="9" width="20" height="14" fill="#2B2F3A" />
  <rect x="8" y="23" width="16" height="4" fill="#1F2430" />
  <!-- Helmet Crest / Highlight -->
  <rect x="13" y="5" width="6" height="3" fill="#4A3F35" />
  <rect x="7" y="10" width="2" height="10" fill="#3D4354" />
  <rect x="23" y="10" width="2" height="10" fill="#1A1E28" />
  <!-- DOOM-style Sealed Visor -->
  <rect x="8" y="12" width="16" height="5" fill="#0B0D14" />
  <rect x="9" y="13" width="14" height="3" fill="#F97316" />
  <rect x="10" y="13" width="4" height="1" fill="#FACC15" />
  <!-- Respirator Vent -->
  <rect x="11" y="20" width="10" height="4" fill="#161B29" />
  <rect x="12" y="21" width="2" height="2" fill="#00F0FF" />
  <rect x="15" y="21" width="2" height="2" fill="#00F0FF" />
  <rect x="18" y="21" width="2" height="2" fill="#00F0FF" />
</svg>
